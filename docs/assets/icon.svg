<!--
  Repofloor's mark: one office, seen from directly above, in the engine's own palette.

  Drawn on a 64-unit grid in multiples of 4, so every edge lands on a pixel boundary at
  16, 32, 64, 128 and 256 — the sizes GitHub, a favicon and an avatar actually ask for.
  Deliberately only one desk, one person and one plant: at 16px anything busier is mush,
  and the thing that has to survive is the shape of a room with someone in it.

  Procedural, like everything else here (CLAUDE.md rule 5): this is shapes in a file you
  can read, not an export from somewhere.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Repofloor: a pixel office seen from above">
  <title>Repofloor</title>

  <!-- Floor. Two tones on a 8-unit checker, as the open plan is drawn. -->
  <rect width="64" height="64" fill="#363c4a"/>
  <g fill="#3c4251">
    <rect x="8"  y="8"  width="8" height="8"/><rect x="24" y="8"  width="8" height="8"/><rect x="40" y="8" width="8" height="8"/>
    <rect x="16" y="16" width="8" height="8"/><rect x="32" y="16" width="8" height="8"/><rect x="48" y="16" width="8" height="8"/>
    <rect x="8"  y="24" width="8" height="8"/><rect x="24" y="24" width="8" height="8"/><rect x="40" y="24" width="8" height="8"/>
    <rect x="16" y="32" width="8" height="8"/><rect x="32" y="32" width="8" height="8"/><rect x="48" y="32" width="8" height="8"/>
    <rect x="8"  y="40" width="8" height="8"/><rect x="24" y="40" width="8" height="8"/><rect x="40" y="40" width="8" height="8"/>
    <rect x="16" y="48" width="8" height="8"/><rect x="32" y="48" width="8" height="8"/><rect x="48" y="48" width="8" height="8"/>
  </g>

  <!-- Walls: a thick shell with a doorway in the bottom edge. -->
  <g fill="#14171d">
    <rect x="0" y="0"  width="64" height="6"/>
    <rect x="0" y="0"  width="6"  height="64"/>
    <rect x="58" y="0" width="6"  height="64"/>
    <rect x="0" y="58" width="24" height="6"/>
    <rect x="40" y="58" width="24" height="6"/>
  </g>
  <!-- The lit inner edge: the only cue for height when you are looking straight down. -->
  <g fill="#474e5e">
    <rect x="6" y="6" width="52" height="2"/>
    <rect x="6" y="6" width="2"  height="52"/>
    <rect x="56" y="6" width="2" height="52"/>
  </g>
  <!-- Door jambs, so the gap reads as an opening rather than a missing tile. -->
  <g fill="#6b7280">
    <rect x="22" y="58" width="2" height="6"/>
    <rect x="40" y="58" width="2" height="6"/>
  </g>

  <!-- Windows in the top wall. -->
  <g fill="#5f7f92">
    <rect x="14" y="1" width="8" height="4"/>
    <rect x="42" y="1" width="8" height="4"/>
  </g>

  <!-- Desk, with its shadow and a lit monitor. -->
  <rect x="14" y="36" width="36" height="4" fill="#05070b" opacity="0.35"/>
  <rect x="14" y="26" width="36" height="10" fill="#8b5e3c"/>
  <rect x="14" y="26" width="36" height="2"  fill="#9d6b45"/>
  <rect x="14" y="34" width="36" height="2"  fill="#6e4529"/>
  <rect x="24" y="18" width="16" height="10" fill="#111318"/>
  <rect x="26" y="20" width="12" height="6"  fill="#7fd3ff"/>

  <!-- Someone at it: shadow, body with a shaded side, head, hair. -->
  <ellipse cx="32" cy="50" rx="7" ry="3" fill="#05070b" opacity="0.38"/>
  <rect x="26" y="40" width="12" height="10" fill="#3b82f6"/>
  <rect x="34" y="40" width="4"  height="10" fill="#2f68c4"/>
  <rect x="27" y="32" width="10" height="9"  fill="#f1c27d"/>
  <rect x="26" y="31" width="12" height="4"  fill="#5a3a1a"/>

  <!-- A plant, because every office has one. -->
  <ellipse cx="14" cy="52" rx="5" ry="2" fill="#05070b" opacity="0.3"/>
  <rect x="11" y="46" width="6" height="6" fill="#a0522d"/>
  <circle cx="14" cy="44" r="5" fill="#3fa35b"/>
  <circle cx="10" cy="46" r="3" fill="#2c7a43"/>
</svg>
