<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Repofloor icon</title>
    <style>
      body { background: #0f1115; color: #e8ebf2; font: 13px/1.5 monospace; padding: 24px; }
      .row { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 28px; }
      figure { margin: 0; text-align: center; }
      img { image-rendering: pixelated; display: block; }
      figcaption { margin-top: 6px; color: #9aa3b5; }
      .light { background: #ffffff; padding: 16px; display: inline-flex; gap: 24px; align-items: flex-end; border-radius: 6px; }
      .round img { border-radius: 50%; }
      h2 { font-size: 13px; color: #9aa3b5; font-weight: normal; margin: 0 0 10px; }
    </style>
  </head>
  <body>
    <p style="color:#9aa3b5">The SVG is the source. The PNGs beside it are output — regenerate them with
      <code>node scripts/icon-png.mjs</code> after changing it.</p>
    <h2>on the dark it was drawn for</h2>
    <div class="row">
      <figure><img src="icon.svg" width="256" height="256" /><figcaption>256</figcaption></figure>
      <figure><img src="icon.svg" width="128" height="128" /><figcaption>128</figcaption></figure>
      <figure><img src="icon.svg" width="64" height="64" /><figcaption>64</figcaption></figure>
      <figure><img src="icon.svg" width="32" height="32" /><figcaption>32</figcaption></figure>
      <figure><img src="icon.svg" width="16" height="16" /><figcaption>16</figcaption></figure>
    </div>

    <h2>on white, which is where a GitHub avatar lands</h2>
    <div class="light">
      <figure><img src="icon.svg" width="128" height="128" /><figcaption style="color:#555">128</figcaption></figure>
      <figure><img src="icon.svg" width="48" height="48" /><figcaption style="color:#555">48</figcaption></figure>
      <figure><img src="icon.svg" width="20" height="20" /><figcaption style="color:#555">20</figcaption></figure>
    </div>

    <h2>cropped round, as an org avatar is shown</h2>
    <div class="row round">
      <figure><img src="icon.svg" width="128" height="128" /><figcaption>128</figcaption></figure>
      <figure><img src="icon.svg" width="40" height="40" /><figcaption>40</figcaption></figure>
      <figure><img src="icon.svg" width="20" height="20" /><figcaption>20</figcaption></figure>
    </div>
  </body>
</html>
