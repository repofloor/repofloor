name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: typecheck resolves @repofloor/* through their built dist/*.d.ts
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Ensure lite-action bundle is committed and fresh
        run: |
          git diff --exit-code -- apps/lite-action/dist || {
            echo "::error::apps/lite-action/dist is stale. Run 'pnpm build' and commit the result."; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: demo-site
          path: apps/demo/dist
