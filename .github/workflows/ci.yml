name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: typecheck resolves @repofloor/* through their built dist/*.d.ts
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Ensure lite-action bundle is committed and fresh
        run: |
          git diff --exit-code -- apps/lite-action/dist || {
            echo "::error::apps/lite-action/dist is stale. Run 'pnpm build' and commit the result."; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: demo-site
          path: apps/demo/dist

  # Separate and parallel rather than a step on build-test: it shares nothing with it
  # (no Node, no pnpm install), and the failures it catches are the ones `pnpm build`
  # cannot — so finding out about them at the same time rather than after is worth the
  # extra runner.
  #
  # Why this exists: each Dockerfile carries its own list of which workspace packages to
  # COPY and build, and the workspace build passes regardless of whether that list is
  # right. Adding packages/collect broke every image while CI stayed green, and before
  # that a missing .dockerignore copied the host's node_modules over the installed one —
  # loudly on Windows, and silently with whatever was lying around on Linux. Both were
  # found by hand. Neither can be again.
  images:
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml marks WEBHOOK_SECRET as required, so interpolation fails
      # without one even for a build. Nothing is run here; this value reaches no image.
      WEBHOOK_SECRET: ci-interpolation-only
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build every image docker-compose.yml defines
        # bake reads the compose file itself, so a service added there is covered
        # without anyone remembering to add it here too.
        run: |
          docker buildx bake -f docker-compose.yml \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'
