# Full mode, locally, in one command:
#
#   WEBHOOK_SECRET=dev-secret docker compose up --build
#
# Then open http://localhost:8080 — the whole of Full mode behind one origin.
#
# Brings up Postgres, apps/api (8787), apps/realtime (8788) and apps/web behind a Caddy
# that serves the bundle and proxies both services (8080). Migrations run at api
# startup, so the first boot creates the schema itself. api and realtime stay published
# on their own ports for `pnpm smoke` and for poking at them directly; nothing in the
# stack uses those published ports to reach them.
#
# POSTGRES_PORT, WEB_PORT, API_PORT and REALTIME_PORT move anything that collides with
# something already running on the host.
#
# Lite mode needs none of this — see docs/LITE.md.
#
# apps/realtime is the WebSocket fan-out on 8788 (ADR 0002): it LISTENs on the same
# Postgres and asks api to authorize every socket.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repofloor
      POSTGRES_PASSWORD: repofloor
      POSTGRES_DB: repofloor
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repofloor -d repofloor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Required. The GitHub App webhook secret; the service refuses to start without it.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET, the same value as your GitHub App webhook secret}
      DATABASE_URL: postgres://repofloor:repofloor@postgres:5432/repofloor
      PORT: "8787"
      HOST: 0.0.0.0
      # Optional: "Sign in with GitHub". All four together or none at all; without them
      # every caller presents its own token, as before. See apps/api/README.md.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Optional: acting as the App, to record installations and mint installation
      # tokens. Id and key together or neither.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    ports:
      - "${API_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    environment:
      # The same database api writes to: one LISTEN connection, plus snapshot reads
      # for updates too large to travel as a NOTIFY payload.
      DATABASE_URL: postgres://repofloor:repofloor@postgres:5432/repofloor
      # Every socket is authorized by asking api, forwarding the caller's own
      # credentials. realtime holds no credential of its own.
      API_URL: http://api:8787
      PORT: "8788"
      HOST: 0.0.0.0
      PRESENCE_TTL_MS: ${PRESENCE_TTL_MS:-90000}
    ports:
      - "${REALTIME_PORT:-8788}:8788"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # The bundle, and the one origin everything is served from. Open this, not :8787.
  #
  # Same origin is not a preference: the session cookie is HttpOnly and SameSite=Lax
  # and api sends no CORS headers, so a page served from anywhere else would be
  # permanently signed out. api and realtime both answer on /office/:owner/:repo, and
  # this is what routes between them by the Upgrade header — see apps/web/Caddyfile.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
